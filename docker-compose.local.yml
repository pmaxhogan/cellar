# Local full-stack test against a real build of the image.
#
#   docker compose -f docker-compose.local.yml up --build
#
# INSECURE_ALLOW_PUBLIC_ACCESS=1 disables authentication AND forces the server
# to bind 127.0.0.1 inside the container, so the published port below will not
# reach it. Probe it from inside instead:
#
#   docker compose -f docker-compose.local.yml exec cellar curl -s http://127.0.0.1:8080/healthz
#
# or set up Cloudflare Access and drop the flag to use the published port.
# ./tmp-data (which also holds the media mount) is gitignored.

services:
  cellar:
    build:
      context: .
      args:
        CELLAR_VERSION: local
    image: cellar:local
    container_name: cellar-local
    environment:
      INSECURE_ALLOW_PUBLIC_ACCESS: "1"
      DATA_DIR: /data
      LOG_LEVEL: debug
      PUBLIC_ORIGIN: http://127.0.0.1:8080
    ports:
      - "8080:8080"
    volumes:
      - ./tmp-data:/data
      - ./tmp-data/media:/media
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
